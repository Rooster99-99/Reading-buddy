; Reading Buddy for the 3.2" Cheap Yellow Display (ESP32-2432S032)
;
; Pick the environment that matches the sticker/listing on your board:
;   ESP32-2432S032R  -> resistive touch  (screen "gives" a little when pressed)
;   ESP32-2432S032C  -> capacitive touch (hard glass, like a phone)
; In VS Code + PlatformIO: bottom status bar -> choose the env -> Upload.

[platformio]
default_envs = cyd32_resistive

[env]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
build_flags =
  ; --- TFT_eSPI setup for the 3.2" CYD (no need to edit User_Setup.h) ---
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  ; --- Color fixes, only if needed ---
  ; Colors look swapped (cream looks bluish, red looks blue)? add:  -DTFT_RGB_ORDER=TFT_BGR
  ; Whole screen looks like a photo negative (dark background)? add: -DTFT_INVERSION_OFF=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000

[env:cyd32_resistive]
build_flags =
  ${env.build_flags}
  -DTOUCH_RESISTIVE=1
  -DTOUCH_CS=33

[env:cyd32_capacitive]
build_flags =
  ${env.build_flags}
  -DTOUCH_CAPACITIVE=1
